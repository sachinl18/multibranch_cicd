trigger:
  branches:
    include:
      - develop

pool:
  name: 'Default'      # your self-hosted agent pool

variables:
# (optional) if you store AWS keys in a variable group
- group: mumbai_azure

# --------- General AWS / env settings ----------
- name: AWS_REGION
  value: 'ap-south-1'     # region for ECR + S3

- name: ENVIRONMENT_NAME
  value: 'dev'

- name: PROJECT
  value: 'batch-dev'

- name: IMAGE_NAME
  value: 'enate-l2-dev'

# This MUST match the jar Gradle produces in app/build/libs/
- name: JAR_FILE
  value: 'jb-hello-world-0.1.0-1.0-SNAPSHOT.jar'

# --------- S3 settings ----------
- name: S3_BUCKET
  value: 'batchartifacts-sachi'

# unique S3 key (includes env & build number)
- name: S3_KEY
  value: '$(PROJECT)/$(ENVIRONMENT_NAME)/$(Build.BuildId)/$(JAR_FILE)'

# --------- AWS DevOps service connection ----------
- name: AWS_SERVICE_CONNECTION
  value: 'S3_Lmabda'   # existing AWS service connection

# --------- ECR settings ----------
# 👈 This should be just the account ID, NOT the full URL
- name: ECR_ACCOUNT_ID
  value: '869935097287'   # <--- your AWS account id only

- name: ECR_REPOSITORY
  value: 'batch-main'     # the ECR repo name (e.g. batch-main or batch-dev)

stages:
# =========================
# Stage 1 - Build with Gradle
# =========================
- stage: Build
  displayName: 'Build (Gradle)'
  jobs:
  - job: BuildJob
    displayName: 'Gradle Build'
    steps:
    - checkout: self
      clean: true

    - script: |
        echo "Java version:"
        java -version || true
        echo "Gradle wrapper version:"
        ./gradlew -v || (echo "Gradle wrapper missing or not executable"; exit 1)
      displayName: 'Verify build tools'

    - script: |
        echo ">>>>>>>>>>>>>>>>>> Gradle Build Started"
        chmod +x gradlew
        ./gradlew clean build
        echo "<<<<<<<<<<<<<<<<<< Gradle Build Completed"

        echo ">>> After build, listing JARs under */build/libs:"
        find . -maxdepth 4 -path "*build/libs/*.jar" -print || true
      displayName: 'Gradle: clean build'

    - script: |
        echo "Listing produced jars in app/build/libs:"
        ls -lah app/build/libs || true
        ls -lah app/build/libs/$(JAR_FILE) || echo "Expected JAR $(JAR_FILE) not found in app/build/libs"
      displayName: 'List build artifacts'

    # 👉 Publish app/build/libs so the artifact root has: JAR + (optionally) Dockerfile
    - publish: app/build/libs
      artifact: drop
      displayName: 'Publish build artifacts (for S3 + Docker)'

# =========================
# Stage 2 - Upload JAR to S3
# =========================
- stage: UploadToS3
  displayName: 'Upload artifact to S3'
  dependsOn: Build
  jobs:
  - job: UploadJob
    displayName: 'S3 Upload'
    steps:
    - download: current
      artifact: drop

    - script: |
        echo ">>> Debug: JAR in drop"
        echo "Pipeline.Workspace: $(Pipeline.Workspace)"
        ls -lah $(Pipeline.Workspace)/drop || true
        ls -lah $(Pipeline.Workspace)/drop/$(JAR_FILE) || echo "JAR not found at drop/$(JAR_FILE)"
      displayName: 'Debug: check downloaded artifact'

    - task: AWSCLI@1
      displayName: 'Test S3 connectivity'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 's3'
        awsSubCommand: 'ls'
        awsArguments: 's3://$(S3_BUCKET)'

    - task: AWSCLI@1
      displayName: 'Upload JAR to S3'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 's3'
        awsSubCommand: 'cp'
        awsArguments: '$(Pipeline.Workspace)/drop/$(JAR_FILE) s3://$(S3_BUCKET)/$(S3_KEY) --no-progress'

# =========================
# Stage 3 - Build & Push Docker Image to ECR
# =========================
- stage: BuildAndPushECR
  displayName: 'Build & Push Docker Image to ECR'
  dependsOn: UploadToS3
  jobs:
  - job: ECRJob
    displayName: 'Docker build & push'
    steps:
    - download: current
      artifact: drop

    - script: |
        echo "Contents of docker context (drop):"
        ls -lah $(Pipeline.Workspace)/drop
      displayName: 'List docker context'

    # 👇 No changeEnv_region.sh anymore, just use your Dockerfile as-is
    - script: |
        cd $(Pipeline.Workspace)/drop

        echo "Dockerfile content:"
        cat Dockerfile || echo "Dockerfile missing!"

        echo "JAR present?"
        ls -lah $(JAR_FILE) || echo "JAR $(JAR_FILE) not found in docker context"
      displayName: 'Check Docker context files'

    - script: |
        echo "Login to ECR..."
        aws ecr get-login-password --region $(AWS_REGION) \
          | sudo docker login --username AWS --password-stdin $(ECR_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com
      displayName: 'Docker login to ECR'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)

    - script: |
        cd $(Pipeline.Workspace)/drop

        FULL_REPO="$(ECR_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/$(ECR_REPOSITORY)"
        IMAGE_TAG="$(IMAGE_NAME)"

        echo "Building Docker image: $FULL_REPO:$IMAGE_TAG"
        sudo docker build -t $FULL_REPO:$IMAGE_TAG .

        echo "Pushing Docker image: $FULL_REPO:$IMAGE_TAG"
        sudo docker push $FULL_REPO:$IMAGE_TAG
      displayName: 'Docker build & push'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)
